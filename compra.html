<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Comprar Calendario 2027">
    <title>Comprar Calendario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stylesheets/style.css">
    <link rel="stylesheet" href="stylesheets/compra.css">
</head>
<body>
    <!-- Navbar -->
    <header class="navbar" id="navbar">
        <a href="index.html" class="nav-brand">Calendario 2027</a>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="origenes.html" class="nav-link">Orígenes</a>
            <a href="sobre_mi.html" class="nav-link">Sobre mí</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="compra-container">
            <!-- Left: Product Photos -->
            <div class="compra-left">
                <img src="public/images/mock_up.png" alt="Calendario 2027" class="main-product-img">
            </div>

            <!-- Right: Details & Purchase -->
            <div class="compra-right">
                <h1>Calendario 2027 de Pared</h1>
                <p class="author">Por: Lourdes</p>
                
                <div class="price">€ 25.00</div>

                <div class="purchase-action">
                    <div class="quantity-selector">
                        <button class="qty-btn" onclick="updateQty(-1)">−</button>
                        <input type="number" id="qty" value="1" min="1" readonly>
                        <button class="qty-btn" onclick="updateQty(1)">+</button>
                    </div>
                    <button class="buy-button" onclick="buyWhatsapp()">COMPRAR</button>
                </div>

                <div class="product-info">
                    <h3>Descripción</h3>
                    <p>Organiza tu mes. </p>
                    
                    <h3>Características</h3>
                    <ul>
                        <li><strong>Formato:</strong> 30 x 40 cm</li>
                        <li><strong>Encuadernación:</strong> Anillado</li>
                        <li><strong>Interior:</strong> 12 páginas</li>
                        <li><strong>Papel:</strong> Mate de 250 g</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Navbar scroll effect
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        function updateQty(change) {
            const input = document.getElementById('qty');
            let current = parseInt(input.value);
            if (current + change >= 1) {
                input.value = current + change;
            }
        }

        function buyWhatsapp() {
            const qty = document.getElementById('qty').value;
            let message = '';
            
            if (parseInt(qty) === 1) {
                message = `¡Hola Lourdes! Me gustaría comprar un calendario.`;
            } else {
                message = `¡Hola Lourdes! Me gustaría comprar ${qty} calendarios.`;
            }
            
            const encodedMessage = encodeURIComponent(message);
            const url = `https://wa.me/34603536305?text=${encodedMessage}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
