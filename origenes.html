        // Render Grid
        const gridContainer = document.getElementById('comicGrid');
        
        comicsData.forEach((comic, index) => {
            const container = document.createElement('div');
            container.className = 'comic-window-container';
            container.onclick = () => openModal(index);

            const img = document.createElement('img');
            img.src = comic.window;
            img.className = 'comic-window';
            img.alt = `Ventana ilustrada: ${comic.folder} - Serie Historias de la ventana por Lourdes Bruzzoni`;

            const title = document.createElement('div');
            title.className = 'comic-title';
            // Capitalize first letter
            title.innerText = comic.folder.charAt(0).toUpperCase() + comic.folder.slice(1);

            container.appendChild(img);
            container.appendChild(title);
            gridContainer.appendChild(container);
        });

        // Modal Logic
        const modal = document.getElementById('comicModal');
        const carouselContainer = document.getElementById('carouselContainer');
        const modalTitle = document.getElementById('modalTitle');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        let currentComicIndex = 0;
        let currentPanelIndex = 0;

        function openModal(comicIndex) {
            currentComicIndex = comicIndex;
            currentPanelIndex = 0;
            const comic = comicsData[currentComicIndex];
            
            modalTitle.innerText = comic.folder.charAt(0).toUpperCase() + comic.folder.slice(1);
            
            // Generate image tags
            carouselContainer.innerHTML = '';
            
            // Ya no invertimos el orden porque renombraste los archivos a 1.jpg, 2.jpg...
            const panels = comic.panels;

            panels.forEach((panelSrc, idx) => {
                const img = document.createElement('img');
                img.src = panelSrc;
                img.alt = `Viñeta ${idx + 1} del cómic ${comic.folder} por Lourdes Bruzzoni`;
                img.className = 'carousel-image';
                if (idx === 0) img.classList.add('active');
                carouselContainer.appendChild(img);
            });

            updateButtons();
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; // prevent scrolling behind
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigateCarousel(direction) {
            const panels = carouselContainer.querySelectorAll('.carousel-image');
            panels[currentPanelIndex].classList.remove('active');
            
            currentPanelIndex += direction;
            
            panels[currentPanelIndex].classList.add('active');
            updateButtons();
        }

        function updateButtons() {
            const panels = comicsData[currentComicIndex].panels;
            prevBtn.disabled = currentPanelIndex === 0;
            nextBtn.disabled = currentPanelIndex === panels.length - 1;
        }

        // Escape key to close
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeModal();
            }
            if (e.key === 'ArrowRight' && modal.classList.contains('active') && !nextBtn.disabled) {
                navigateCarousel(1);
            }
            if (e.key === 'ArrowLeft' && modal.classList.contains('active') && !prevBtn.disabled) {
                navigateCarousel(-1);
            }
        });
